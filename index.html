<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Zeus Ratón</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Contenedor para los botones sobre el canvas */
  #button-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 640px;
    height: 480px;
    pointer-events: none; /* desactiva clicks en fondo, se activan solo los botones */
  }
</style>
</head>
<body>
  <canvas id="gameCanvas" width="640" height="480"></canvas>
  <div id="button-container"></div>
  <script src="script.js"></script>
</body>
</html>
